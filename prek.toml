default_install_hook_types = [
  "pre-commit",
  "commit-msg",
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-toml"
exclude = "^uv\\.lock$"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-executables-have-shebangs"

[[repos.hooks]]
id = "check-merge-conflict"
args = [
  "--assume-in-merge",
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.6"

[[repos.hooks]]
id = "ruff-check"
args = [
  "--fix",
]

[[repos.hooks]]
id = "ruff-format"

# uv-lock owns the generated lockfile's formatting.
[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.1"
hooks = [
  { id = "uv-lock" },
]

[[repos]]
repo = "https://github.com/adrienverge/yamllint.git"
rev = "v1.38.0"

[[repos.hooks]]
id = "yamllint"
args = [
  "--strict",
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [
  { id = "shellcheck" },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.38.0"

[[repos.hooks]]
id = "check-github-workflows"
args = [
  "--verbose",
]

[[repos.hooks]]
id = "check-gitlab-ci"
args = [
  "--verbose",
]

[[repos.hooks]]
id = "check-renovate"
args = [
  "--verbose",
]
additional_dependencies = [
  "pyjson5",
]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = [
  "commit-msg",
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.9.6"

[[repos.hooks]]
id = "tombi-lint"
args = [
  "--offline",
]

[[repos.hooks]]
id = "tombi-format"
args = [
  "--offline",
]
exclude = "^uv\\.lock$"

# Official mirror: the prebuilt alint wheel. mise owns the CLI used by tasks.
[[repos]]
repo = "https://github.com/asamarts/alint-pre-commit"
rev = "v0.22.0"

[[repos.hooks]]
id = "alint"
