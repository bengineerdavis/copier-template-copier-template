---
extends: default

# These files are managed by their respective template or CLI.
ignore: |
  .agentic-answers.yml
  backlog/config.yml

rules:
  # renovate version comments use single space before inline comment
  comments:
    ignore: |
      .github/workflows/*.yml
  document-start:
    ignore: |
      copier.yml
      .copier-answers.*.yml
      .gitlab-ci.yml
  new-line-at-end-of-file: disable
  new-lines:
    type: unix
  line-length:
    max: 120
