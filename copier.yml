_min_copier_version: "9.18.2"

_subdirectory: meta_template
_answers_file: .copier-answers.<< template_name >>.yml
_envops:
  block_end_string: "%>"
  block_start_string: "<%"
  comment_end_string: "#>"
  comment_start_string: "<#"
  variable_end_string: ">>"
  variable_start_string: "<<"
  trim_blocks: true
  undefined: jinja2.StrictUndefined  # error loudly for undefined variables
_templates_suffix: .tmpl

template_name:  # Useful for namespacing
  type: str
  default: 'copier-template'
  when: false  # hidden question: reusable variable with default value

template_dir:
  type: str
  default: template
  help: Subdirectory within the repo that will contain the template files (default 'template')

vcs_platform:
  type: str
  help: Which VCS platform would you like CI setup for?
  choices:
    Gitlab: gitlab
    GitHub: github
    None: ""
  default: github

output_template_name:
  type: str
  help: Name of your copier template
  default: your-template-name

template_style:
  type: str
  help: Template delimiter style for the generated template
  choices:
    Jinja: jinja
    Square Brackets: square_brackets
  default: jinja

var_start:
  type: str
  default: "<< '{{' if template_style == 'jinja' else '[[' >>"
  when: false

var_end:
  type: str
  default: "<< '}}' if template_style == 'jinja' else ']]' >>"
  when: false

include_pydantic_validation:
  type: bool
  help: Include support for validation with Pydantic models (and multiline errors)
  default: false

include_template_extensions:
  type: bool
  help: Include support for local extensions
  default: false

include_openspec:
  type: bool
  help: Include OpenSpec for spec-driven changes and shared agent skills
  default: false

task_management:
  type: str
  help: Markdown-native task management for repository-wide work
  choices:
    None: none
    Backlog.md: backlog-md
    backlog-md-py (Python): backlog-md-py
  default: none

include_alint:
  type: bool
  help: Include alint repository-structure linting
  default: false

all_python_versions:
  type: yaml
  default: |
    - '3.10'
    - '3.11'
    - '3.12'
    - '3.13'
    - '3.14'
  when: false

min_python_version:
  type: str
  help: Minimum Python version the generated template's code will support.
  choices: "<< all_python_versions >>"
  default: "<< all_python_versions | first >>"

python_versions:
  type: yaml
  default: "<< all_python_versions[all_python_versions.index(min_python_version):] >>"
  when: false

# Plain-language licenses from the Blue Oak Council — https://blueoakcouncil.org
# Fair Source licenses (FSL; converts to MIT/Apache-2.0 after 2 years) — https://fsl.software, https://fair.io
# FSL identifiers are not in the SPDX list; the generated pyproject omits the license key for them
license_type:
  type: str
  help: License for the generated template (SPDX identifier; texts verbatim from spdx/license-list-data)
  choices:
    MIT License: MIT
    Apache License 2.0: Apache-2.0
    BSD 2-Clause "Simplified" License: BSD-2-Clause
    BSD 3-Clause "New" or "Revised" License: BSD-3-Clause
    ISC License: ISC
    Blue Oak Model License 1.0.0: BlueOak-1.0.0
    Mozilla Public License 2.0: MPL-2.0
    BSD Zero Clause License: 0BSD
    Creative Commons Zero v1.0 Universal: CC0-1.0
    The Unlicense: Unlicense
    GNU General Public License v3.0 only: GPL-3.0-only
    GNU Lesser General Public License v3.0 only: LGPL-3.0-only
    GNU Affero General Public License v3.0 only: AGPL-3.0-only
    Functional Source License 1.1 (MIT future): FSL-1.1-MIT
    Functional Source License 1.1 (Apache-2.0 future): FSL-1.1-ALv2
    None: none
  default: MIT

license:
  type: bool
  default: "<< license_type != 'none' >>"
  when: false

copyright_year:
  type: str
  default: "<< '%Y' | strftime >>"
  when: "<< license and license_type not in ['none', 'Unlicense', 'CC0-1.0', 'BlueOak-1.0.0'] >>"

copyright_name:
  type: str
  placeholder: "Your Name"
  when: "<< license and license_type not in ['none', 'Unlicense', 'CC0-1.0', 'BlueOak-1.0.0'] >>"

needs_extensions:
  type: bool
  default: "<< include_pydantic_validation or include_template_extensions >>"
  when: false

needs_trust:
  type: bool
  default: "<< include_pydantic_validation or include_template_extensions >>"
  when: false
