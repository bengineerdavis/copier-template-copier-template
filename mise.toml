[tools]
uv = "latest"
# Deliberate pin: the template targets Python 3.12 (pyproject
# requires-python). Renovate advances it within 3.12.x only; crossing to a
# new minor is a template decision, not a tooling one.
python = "3.12"
"npm:@sentry/dotagents" = "latest"
"github:asamarts/alint" = "latest"
"github:kenn-io/roborev" = "latest"
# Concrete pins exist for reproducible installs, not to freeze versions:
# Renovate keeps them current and automerges (docs/tool-updates.md).
prek = "0.5.7"
tombi = "1.9.6"
worktrunk = "0.81.0"

# Renovate cannot own this pin: upstream (opencode.ai, mirrored at
# anomalyco/opencode) publishes 2.x as git tags with no GitHub release
# objects, and Renovate cannot rewrite checksums. `mise run tool-bump`
# (scheduled workflow) bumps version, URLs, and checksums atomically.
[tools."http:opencode"]
version = "2.2.0"

[tools."http:opencode".platforms.linux-x64]
url = "https://opencode.ai/files/bin/2.2.0/opencode-linux-x64-baseline.tar.gz"
checksum = "sha256:6d597970a8cc448f1b9a9f645532584b339dd3ab9583bb5f063f13d83e54768f"

[tools."http:opencode".platforms.linux-arm64]
url = "https://opencode.ai/files/bin/2.2.0/opencode-linux-arm64.tar.gz"
checksum = "sha256:1f1ce0fc07b9245a815ffa9d652dbb80e6b0f07e5bf74ea87d2b1c0339fbac52"

[tools."http:opencode".platforms.macos-x64]
url = "https://opencode.ai/files/bin/2.2.0/opencode-darwin-x64-baseline.zip"
checksum = "sha256:bda15562402475e891d39de5938de7ce052a245f9fd926ab72d32f55b1e26ac3"

[tools."http:opencode".platforms.macos-arm64]
url = "https://opencode.ai/files/bin/2.2.0/opencode-darwin-arm64.zip"
checksum = "sha256:c71b1cd96541539ad38e2a75377d2f43d2a27567289a14371a182e9a0800db3d"

[tasks.install]
description = "Bootstrap dev setup: sync dependencies and register prek hooks"
run = "#!/usr/bin/env bash\nset -euo pipefail\nuv sync\nuv run prek install\n"

[tasks.test]
description = "Run the pytest suite (tmp stored under ./tmp/pytest)"
run = "#!/usr/bin/env bash\nset -euo pipefail\nrm -rf ./tmp/pytest\nmkdir -p ./tmp\nuv run --frozen pytest --basetemp=./tmp/pytest/ \"$@\"\n"

[tasks.cog]
description = "Regenerate cogapp-managed files (e.g. .gitignore)"
run = "uvx --from cogapp cog -r @cog.files"

[tasks.lint]
description = "Run lints"
run = "uv run prek run --all-files"

[tasks.format]
description = "Auto-fix lint findings and format Python"
run = '''
#!/usr/bin/env bash
set -euo pipefail
uv run ruff check --fix tests
uv run ruff format tests
'''

[tasks.format-check]
description = "Verify Python formatting and lint cleanliness"
wait_for = ["lint"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
uv run ruff format --check tests
uv run ruff check tests
'''

[tasks.type-check]
description = "Type-check the template test harness"
wait_for = ["lint"]
run = "uv run mypy tests"

[tasks.quality]
description = "Run all code-quality gates"
depends = ["lint", "format-check", "type-check"]

[tasks.maintenance]
description = "Update hooks and lockfile"
run = "#!/usr/bin/env bash\nset -euo pipefail\nuv run prek update\nuv lock --upgrade\n"

[tasks.tool-bump]
description = "Bump the opencode pin (version, URLs, checksums) to the newest upstream release"
run = "./scripts/update-opencode.sh"

[tasks.update-template]
description = "Update this repo from its own template (self-hosted)"
run = "#!/usr/bin/env bash\nuv run copier update -a .copier-answers.copier-template.yml --vcs-ref HEAD \"$@\"\n"

[tasks.update-template-auto]
description = "Update from upstream with existing answers (non-interactive)"
run = "#!/usr/bin/env bash\nuv run copier update -a .copier-answers.copier-template.yml -A --vcs-ref HEAD \"$@\"\n"

[tasks.template-current]
description = "Render the current template into tmp/current"
run = "#!/usr/bin/env bash\nset -euo pipefail\nrm -rf tmp/current\nuv run copier copy --vcs-ref HEAD . tmp/current\n"

[tasks.template-diff]
description = "Compare last release render against HEAD render"
run = "#!/usr/bin/env bash\nset -euo pipefail\nrm -rf tmp/before tmp/after\nuv run copier copy . tmp/before\nuv run copier copy --vcs-ref HEAD . tmp/after\ndiff -r tmp/before tmp/after\n"

[tasks.release-dry]
description = "Dry-run release, e.g. mise run release-dry -- --minor"
run = "#!/usr/bin/env bash\nuv run python-semantic-release --noop version \"$@\"\n"

[tasks.release-actual]
description = "Release a new version, e.g. mise run release-actual -- --minor"
run = "#!/usr/bin/env bash\nuv run python-semantic-release version \"$@\"\ngit fetch\n"

[tasks.demo-record]
description = "Record a demo of copier copy using asciinema (tmp/demo.cast)"
run = "#!/usr/bin/env bash\nset -euo pipefail\nmkdir -p tmp\nasciinema rec --overwrite tmp/demo.cast\n"

[tasks.demo-upload]
description = "Upload tmp/demo.cast to asciinema.org and update README.md"
run = "#!/usr/bin/env bash\nset -euo pipefail\nURL=$(asciinema upload tmp/demo.cast | tee /dev/tty | grep -oE 'https://asciinema\\.org/a/[A-Za-z0-9]+')\npython3 -c \"\nimport re, sys\nurl = sys.argv[1]\nreadme = open('README.md').read()\nupdated = re.sub(r'https://asciinema\\.org/a/[A-Za-z0-9]+', url, readme)\nopen('README.md', 'w').write(updated)\nprint(f'Updated README.md with {url}')\n\" \"$URL\"\n"

[tasks.example-docker]
description = "Example: docker volume mount to inspect the project in CI"
run = "#!/usr/bin/env bash\ndocker run -v \"$(pwd)\":/code/ --entrypoint=/bin/bash python:3.12-slim -c 'cat /code/pyproject.toml'\n"

[tasks.backlog-init]
description = "Initialize the backlog task store (idempotent)"
run = "#!/usr/bin/env bash\nset -euo pipefail\nif [ -f backlog/config.yml ]; then\n  echo \"backlog already initialized\"\n  exit 0\nfi\nuvx --from backlog-md-py backlog-py init --defaults\n"

[tasks.dotagents-install]
description = "Refresh dotagents managed state (skills, MCP, subagents)"
run = "dotagents --project install"

[tasks.roborev-start]
description = "Ensure the roborev review daemon is running"
run = "roborev start 2>/dev/null || roborev serve 2>/dev/null || true"

[tasks.roborev-status]
description = "Show open fast-loop findings for the current branch"
run = "roborev status"

[tasks.roborev-fix]
description = "Hand open findings back to the live agent (fix while fresh)"
run = "roborev fix"

[tasks.review-deep]
description = "Slow loop: deep review of the working branch, report to docs/reviews/"
run = "#!/usr/bin/env bash\nset -euo pipefail\nmkdir -p docs/reviews\nopencode run --agent review-deep \"Run the review-deep agent procedure for this repository.\"\n"

[tasks.check]
description = "Run repository and Python quality gates"
depends = ["quality"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
alint check
tombi lint mise.toml
'''
